---
- name: Configure jumphosts (Ubuntu 22.04.5)
  hosts: jumphosts
  become: yes
  gather_facts: yes

  vars:
    # Ansible-managed netplan file (lab interface only)
    netplan_file: /etc/netplan/01-ansible-lab.yaml

  tasks:

  # ------------------------------------------------------------------
  # Hostname (inventory-driven best practice)
  # ------------------------------------------------------------------
  - name: Set system hostname (persistent)
    ansible.builtin.command: hostnamectl set-hostname "{{ inventory_hostname }}"
    tags: hostname

  - name: Ensure /etc/hosts contains hostname mapping
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127\\.0\\.1\\.1\\s+'
      line: "127.0.1.1 {{ inventory_hostname }}"
      state: present
    tags: hostname

  # ------------------------------------------------------------------
  # Packages
  # ------------------------------------------------------------------
  - name: Ensure apt cache updated and upgrade packages
    ansible.builtin.apt:
      update_cache: yes
      upgrade: dist
      autoremove: yes
      autoclean: yes
    tags: packages

  - name: Install required packages
    ansible.builtin.apt:
      name:
        - chrony
        - netplan.io
      state: present
      update_cache: yes
    tags: packages

  - name: Set default password encryption method to SHA512 in /etc/login.defs
    ansible.builtin.lineinfile:
      path: /etc/login.defs
      regexp: '^ENCRYPT_METHOD\s+'
      line: "ENCRYPT_METHOD SHA512"
      state: present
    tags: users, packages

  - name: Ensure libpam-runtime package is installed
    ansible.builtin.apt:
      name: libpam-runtime
      state: present
    tags: packages, users

  - name: Ensure SHA512 is selected as the default hashing method via pam-auth-update
    ansible.builtin.command: pam-auth-update --enable sha512
    # This command updates the /etc/pam.d/common-* files correctly
    changed_when: true # This command always reports success, so we force Ansible to report a change
    tags: users

  # ------------------------------------------------------------------
  # Time & NTP
  # ------------------------------------------------------------------
  - name: Set system timezone
    ansible.builtin.command: timedatectl set-timezone "{{ timezone }}"
    tags: timezone

  - name: Configure chrony NTP servers
    block:
      - name: Backup existing chrony.conf if present
        ansible.builtin.copy:
          src: /etc/chrony/chrony.conf
          dest: /etc/chrony/chrony.conf.bak
          remote_src: yes
        ignore_errors: yes

      - name: Template chrony.conf
        ansible.builtin.template:
          src: chrony.conf.j2
          dest: /etc/chrony/chrony.conf
          owner: root
          group: root
          mode: '0644'
        notify: restart chrony
    tags: ntp

  # ------------------------------------------------------------------
  # Student user (PER HOST via host_vars)
  # ------------------------------------------------------------------
  - name: Assert student user variables are defined
    ansible.builtin.assert:
      that:
        - student_user is defined
        - student_pass_hash is defined
      fail_msg: "student_user and student_pass_hash must be defined in host_vars"
    tags: users

  - name: Create student user
    ansible.builtin.user:
      name: "{{ student_user }}"
      comment: "Lab student account"
      password: "{{ student_pass_hash }}"
      groups: sudo
      shell: /bin/bash
      create_home: yes
      state: present
      update_password: always
    tags: users

  - name: Ensure sudoers file for student allows NOPASSWD
    ansible.builtin.copy:
      dest: "/etc/sudoers.d/{{ student_user }}"
      content: "{{ student_user }} ALL=(ALL) NOPASSWD:ALL\n"
      owner: root
      group: root
      mode: '0440'
    tags: users

  - name: Ensure SSH Password Authentication is enabled
    ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: '^(#\s*)?PasswordAuthentication\s+'
      line: "PasswordAuthentication yes"
      state: present
    notify: restart sshd
    tags: users

  # ------------------------------------------------------------------
  # Netplan (LAB INTERFACE ONLY – ens4)
  # ------------------------------------------------------------------
  - name: Configure netplan for lab interface only (ens4)
    ansible.builtin.template:
      src: netplan-lab.j2
      dest: "{{ netplan_file }}"
      owner: root
      group: root
      mode: '0644'
    notify: apply netplan
    tags: netplan

  handlers:
    - name: restart chrony
      ansible.builtin.service:
        name: chrony
        state: restarted

    - name: apply netplan
      ansible.builtin.command: netplan apply

    - name: restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
